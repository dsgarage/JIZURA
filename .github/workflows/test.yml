# fork (dsgarage/JIZURA) only: builds every edition so develop / main の必須チェック `test` を満たす. Not sent upstream.
name: test
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 build.py
      - run: node tools/export_ae_data.js
      - run: python3 build_ae.py
      - run: python3 build_cep.py
      # ビルド成果物（index.html 等・ae/data.json・JIZURA_AE*.jsx）がコミット済みのものと一致すること
      - run: git diff --exit-code --stat
